
# --- NeoDCT ---------------------------------------------------------------
#
# Built-in, not shipped as a file. mpv treats a line here beginning with a
# bare '#' as a default binding (see mp_input_load_config), so these apply
# even when no config exists and --no-config was passed. That matters more
# than it sounds: the phone has no keyboard, no window manager and no task
# switcher, so an mpv that cannot be quit is a phone that has to have its
# battery pulled.
#
# These mirror System/core/MediaWidget/input.conf, which is what the keypad
# bridge sends over the IPC socket. Both paths, one behaviour.

# BS is the key NeoDCT prints "C" on. This is the way back to the app.
#BS quit

#ENTER cycle pause

#LEFT seek -10 relative
#RIGHT seek 10 relative

#UP add volume 5
#DOWN add volume -5

#* seek -60 relative
#SHARP seek 60 relative

#1 seek 10 absolute-percent
#2 seek 20 absolute-percent
#3 seek 30 absolute-percent
#4 seek 40 absolute-percent
#5 seek 50 absolute-percent
#6 seek 60 absolute-percent
#7 seek 70 absolute-percent
#8 seek 80 absolute-percent
#9 seek 90 absolute-percent
#0 seek 0 absolute-percent
