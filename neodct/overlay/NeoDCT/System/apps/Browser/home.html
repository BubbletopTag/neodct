<!DOCTYPE html>
<html>
<head>
    <title>NeoDCT Web</title>
    <meta charset="utf-8">
    <!-- The phone's theme, served by the browser. Colours come from it
         and nowhere else, so this page wears whatever theme the phone
         does; see neodct_theme_css.h for the classes. -->
    <link rel="stylesheet" type="text/css" href="about:neodct.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: fantasy;
            margin: 0;
            padding: 0;
        }

        header {
            width: 100%;
            text-align: center;
            padding-top: 6px;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        h1 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1;
        }

        .subtitle {
            font-size: 8px;
            margin-top: 2px;
        }

        .search-container {
            width: 224px;
            margin: 0 auto 8px auto;
        }

        input[type="text"] {
            border-right: none;
            height: 26px;
            width: 190px;
            padding: 0 4px;
            font-family: inherit;
            font-size: 12px;
            border-radius: 0;
        }

        button[type="submit"] {
            /* not the theme's face: the pixel face has no ">" */
            font-family: sans-serif;
            height: 26px;
            width: 26px;
            padding: 0;
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            border-radius: 0;
        }

        .app-grid {
            width: 224px;
            margin: 0 auto;
        }

        .keys {
            width: 224px;
            margin: 8px auto 0 auto;
            padding-top: 4px;
            font-size: 8px;
            line-height: 1.4;
        }

        a.app-icon {
            display: inline-block;
            width: 70px;
            height: 40px;
            text-align: center;
            padding-top: 12px;
            font-size: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header class="nd-bar">
        <h1>NeoDCT Web</h1>
        <div class="subtitle nd-muted">powered by netsurf</div>
    </header>

    <div class="search-container">
        <form action="https://html.duckduckgo.com/html/" method="GET">
            <input type="text" name="q" class="nd-field">
            <button type="submit" class="nd-button">&gt;</button>
        </form>
    </div>

    <div class="app-grid">
        <a href="https://weather.gov" class="app-icon nd-tile">Weather</a>
        <a href="https://lite.cnn.com" class="app-icon nd-tile">News</a>
        <a href="https://en.m.wikipedia.org" class="app-icon nd-tile">Wiki</a>
    </div>

    <div class="keys nd-rule nd-muted">
        <b class="nd-ink">2 4 6 8</b> move &middot; <b class="nd-ink">1 3 7 9</b> move diagonally &middot;
        <b class="nd-ink">5</b> or <b class="nd-ink">Navi</b> opens<br>
        <b class="nd-ink">C</b> is the menu &middot;
        <b class="nd-ink">#</b> changes what the number keys do: arrows &rarr; abc &rarr; ABC &rarr; 123<br>
        Hold <b class="nd-ink">C</b> for three seconds to close the browser.
    </div>

</body>
</html>
