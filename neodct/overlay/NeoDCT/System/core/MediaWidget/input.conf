# NeoDCT key bindings for mpv.
#
# These mirror MediaWidget._KEYMAP exactly, and a test in the host suite
# fails if the two ever drift. Keys normally reach mpv over the IPC socket,
# translated by MediaWidget from the phone's keypad; this file is what
# answers when that bridge is not there.
#
# BS is the only binding that is not a convenience. It is the key NeoDCT
# prints "C" on, and it is the only way back out of a video: the phone has
# no window manager, no task switcher and no second screen, so an mpv that
# cannot be quit is a phone that has to have its battery pulled. Do not
# remove it, and do not bind it to anything that can fail.

BS quit

ENTER cycle pause

LEFT seek -10 relative
RIGHT seek 10 relative

UP add volume 5
DOWN add volume -5

# A minute at a time, for the long ones.
* seek -60 relative
SHARP seek 60 relative

# Jump to a percentage, the way every DVD player did it.
1 seek 10 absolute-percent
2 seek 20 absolute-percent
3 seek 30 absolute-percent
4 seek 40 absolute-percent
5 seek 50 absolute-percent
6 seek 60 absolute-percent
7 seek 70 absolute-percent
8 seek 80 absolute-percent
9 seek 90 absolute-percent
0 seek 0 absolute-percent
