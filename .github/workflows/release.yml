name: Release

# Cutting a release is pushing a tag. Everything else here is bookkeeping.
#
# THIS JOB ATTACHES NO .ndsw, deliberately, and that is not the same as a
# release having none. Building a package means building the whole buildroot
# tree, which takes far longer than a runner should hold, and it needs the
# signing key -- and an unsigned package published as a release would be
# worse than no package at all, because the phone shows "BAD SIGNATURE!
# UPDATE MAY BE CORRUPT!!" to whoever installs it. So the packages are built
# and uploaded from a developer's machine by neodct/tools/release.sh, which
# waits for this job to create the release and then uploads one asset per
# platform it can find a signed, version-matching package for. 0.3.13a and
# 0.3.14a carry two each; see neodct/tests/remote/releases-live.json, which
# is a capture of what this repository actually publishes.
#
# The names to expect are UPDATE-luckfox-armv7.ndsw and, from the first
# release cut after the emulator moved to armv7, UPDATE-qemu-armv7.ndsw.
# UPDATE-qemu-aarch64.ndsw is the retired name and is still what every
# release published so far carries; nothing aliases on the download side, so
# an image built from this tree finds nothing until that first release.

on:
  push:
    tags:
      - '0.*'          # the recent convention: 0.3.7a, no leading v
      - 'v0.*'         # older tags used v0.1.5a; accept both
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build a release for (must already exist)'
        required: true

permissions:
  contents: write      # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Strip a leading v so the tag can be matched against os-release,
          # which never carries one.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the image it claims to be
        run: |
          VERSION_ID=$(sed -n 's/^VERSION_ID=//p' neodct/overlay/etc/os-release \
                       | tr -d '"' | head -n1)
          echo "tag says      : ${{ steps.version.outputs.version }}"
          echo "os-release says: $VERSION_ID"
          if [ "$VERSION_ID" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match" \
                 "VERSION_ID=$VERSION_ID in neodct/overlay/etc/os-release." \
                 "A release whose version disagrees with the image is worse" \
                 "than no release: the phone reports os-release, not the tag."
            exit 1
          fi

      - name: Pull the notes out of the changelog
        id: notes
        run: |
          CHANGELOG=neodct/overlay/NeoDCT/CHANGELOG.txt
          VERSION="${{ steps.version.outputs.version }}"
          # The section for this version: from its heading to the next one.
          awk -v v="$VERSION" '
            $0 == v { grab = 1; next }
            grab && /^[0-9]+\.[0-9]+\.[0-9]+[a-z]?$/ { exit }
            grab { print }
          ' "$CHANGELOG" | sed -e 's/[[:space:]]*$//' > notes.md
          # Every release says who signed it. The phone checks packages
          # against a public key baked into its image, so a package built
          # by anyone else is refused -- that is the design working, not a
          # fault, and whoever hits it deserves to know why in advance.
          cat >> notes.md <<'FOOTER'

          ---

          **Installing:** the phone finds this by itself — *Update* → *Look online*.
          It downloads the package for its own platform onto the SD card and
          installs it. Or copy the `.ndsw` into the `update` folder on the card by
          hand.

          **About the signature.** These packages are signed with the project's
          development key, and the matching public key is built into the images
          published here. That means:

          - On a phone running an image from this repository, the signature verifies
            and the update installs normally.
          - On a phone built from your own tree, it will **not** verify. You will see
            `BAD SIGNATURE! UPDATE MAY BE CORRUPT!!`. That is the phone doing its
            job, not a bug — anyone holding a key matching the one in your image can
            replace your entire root filesystem. Build and sign your own packages
            with your own key (see `neodct/tools/devkey/README.md`).
          FOOTER
          if [ ! -s notes.md ]; then
            echo "No changelog section for $VERSION." > notes.md
            echo "::warning::CHANGELOG.txt has no section headed $VERSION"
          fi
          echo "--- notes ---"; cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; updating its notes."
            gh release edit "$TAG" \
              --title "NeoDCT OS $TAG" --notes-file notes.md
          else
            # Pre-release to match every release so far: this is alpha
            # software and marking it stable would be a lie.
            gh release create "$TAG" \
              --title "NeoDCT OS $TAG" \
              --notes-file notes.md \
              --prerelease
          fi
